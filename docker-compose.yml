services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "${OPEN_WEBUI_PORT:-3001}:8080"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      # Map host gateway so container can reach native Ollama on host
      - "host.docker.internal:host-gateway"

  openui-assets:
    image: nginx:alpine
    container_name: openui-assets
    restart: unless-stopped
    ports:
      - "${OPENUI_ASSETS_PORT:-8081}:80"
    volumes:
      - ./openui-assets/dist:/usr/share/nginx/html/dist:ro
      - ./openui-assets/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  open-webui-data:
